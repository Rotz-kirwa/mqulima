name: Mqulima Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Build & Test Pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify ESLint Compliance
        run: npm run lint

      - name: Run Automated Vitest Test Suite
        run: npm test

      - name: Verify Production Application Build
        run: npm run build
        env:
          NODE_ENV: production
          JWT_SECRET: ci-build-test-secret-key-32-chars-min!!
