<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mqulimaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3822" />
      <stop offset="100%" stop-color="#061C10" />
    </linearGradient>
    <linearGradient id="mqulimaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="goldTraces" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Outer Ring / Border -->
  <circle cx="256" cy="256" r="248" fill="url(#mqulimaBorder)" />
  <!-- Inner Background Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#mqulimaBg)" />
  <!-- Subtle Gold Accent Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#EAB308" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.55" />

  <!-- Mathematically Centered Mqulima Official Agri-Tech Sprout Emblem -->
  <g transform="translate(40, 61.6) scale(3.6)">
    <!-- Central Stalk -->
    <path d="M 50 95 V 15" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" />

    <!-- Left Leaves (Vibrant Forest Emerald) -->
    <path d="M 50 90 C 35 90, 24 79, 23 63 C 34 65, 46 75, 50 90 Z" fill="#15803D" />
    <path d="M 50 72 C 35 72, 24 61, 23 45 C 34 47, 46 57, 50 72 Z" fill="#16A34A" />
    <path d="M 50 54 C 35 54, 24 43, 23 27 C 34 29, 46 39, 50 54 Z" fill="#15803D" />
    <path d="M 50 36 C 36 36, 29 27, 27 13 C 36 15, 46 24, 50 36 Z" fill="#16A34A" />

    <!-- Right Leaves (Fresh High-Contrast Lime Green) -->
    <path d="M 50 90 C 65 90, 76 79, 77 63 C 66 65, 54 75, 50 90 Z" fill="#22C55E" />
    <path d="M 50 72 C 65 72, 76 61, 77 45 C 66 47, 54 57, 50 72 Z" fill="#4ADE80" />
    <path d="M 50 54 C 65 54, 76 43, 77 27 C 66 29, 54 39, 50 54 Z" fill="#22C55E" />
    <path d="M 50 36 C 64 36, 71 27, 73 13 C 64 15, 54 24, 50 36 Z" fill="#4ADE80" />

    <!-- Technology Circuit Traces & Nodes -->
    <path d="M 74 67 L 85 61 H 94" stroke="url(#goldTraces)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="94" cy="61" r="4.5" fill="#FACC15" stroke="#FFFFFF" stroke-width="0.8" />

    <path d="M 74 49 L 87 43 H 97" stroke="#A3E635" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="97" cy="43" r="4.5" fill="#A3E635" stroke="#FFFFFF" stroke-width="0.8" />

    <path d="M 73 31 L 84 24 H 91" stroke="url(#goldTraces)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="91" cy="24" r="4.5" fill="#FACC15" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
