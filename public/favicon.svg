<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlowUltra" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#155E38" />
      <stop offset="55%" stop-color="#0B301D" />
      <stop offset="100%" stop-color="#051C10" />
    </radialGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="goldTraceUltra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Solid Background (Occupies 100% of the favicon box) -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlowUltra)" />
  <rect width="512" height="512" rx="96" fill="none" stroke="url(#borderGlow)" stroke-width="12" />

  <!-- Ultra-Bold, Maximized Centered Mqulima Sprout (Fills 90% of Box) -->
  <g transform="translate(10, 20) scale(4.95)">
    <!-- Central Stalk in Brilliant Pure White -->
    <path d="M 50 96 V 12" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Left Leaves (Deep Vibrant Forest Green) -->
    <path d="M 50 90 C 33 90, 21 78, 20 61 C 32 63, 46 75, 50 90 Z" fill="#15803D" />
    <path d="M 50 72 C 33 72, 21 60, 20 43 C 32 45, 46 57, 50 72 Z" fill="#22C55E" />
    <path d="M 50 54 C 33 54, 21 42, 20 25 C 32 27, 46 39, 50 54 Z" fill="#15803D" />
    <path d="M 50 36 C 34 36, 26 26, 24 11 C 34 13, 46 24, 50 36 Z" fill="#22C55E" />

    <!-- Right Leaves (High-Contrast Fresh Lime) -->
    <path d="M 50 90 C 67 90, 79 78, 80 61 C 68 63, 54 75, 50 90 Z" fill="#4ADE80" />
    <path d="M 50 72 C 67 72, 79 60, 80 43 C 68 45, 54 57, 50 72 Z" fill="#86EFAC" />
    <path d="M 50 54 C 67 54, 79 42, 80 25 C 68 27, 54 39, 50 54 Z" fill="#4ADE80" />
    <path d="M 50 36 C 66 36, 74 26, 76 11 C 66 13, 54 24, 50 36 Z" fill="#86EFAC" />

    <!-- Technology Circuit Traces & Nodes -->
    <path d="M 74 67 L 86 60 H 96" stroke="url(#goldTraceUltra)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="96" cy="60" r="5.2" fill="#FACC15" stroke="#FFFFFF" stroke-width="1.4" />

    <path d="M 74 48 L 88 42 H 99" stroke="#A3E635" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="99" cy="42" r="5.2" fill="#A3E635" stroke="#FFFFFF" stroke-width="1.4" />

    <path d="M 73 30 L 85 23 H 93" stroke="url(#goldTraceUltra)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="93" cy="23" r="5.2" fill="#FACC15" stroke="#FFFFFF" stroke-width="1.4" />
  </g>
</svg>
